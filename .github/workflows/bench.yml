name: Benchmark (manual)

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Fault plan seed"
        default: "1"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: ./init.sh
      - run: .venv/bin/gatedcrew bench --seed "$SEED" --out /tmp/bench.json
        env:
          SEED: ${{ inputs.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: /tmp/bench.json
