[project]
name = "gatedcrew"
version = "0.1.0rc1"
description = "Run a coding agent in short, logged sessions under written budgets, gates and a separate evaluator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shreyas" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gatedcrew = "gatedcrew.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatedcrew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "S108"]
