# gatedcrew default policy. Copy it, change it, and pass it to `gatedcrew init --policy`.

[budget]
max_sessions = 20            # sessions for the whole run
max_wall_seconds = 3600      # wall time for the whole run
session_timeout_seconds = 300  # one worker session
max_tokens = 2000000         # tokens the worker reports, summed
backoff_seconds = 0          # wait after a failed session, doubled each time in a row
backoff_max_seconds = 60

[gates]
max_consecutive_failures = 2  # this many failed sessions in a row asks a human
evaluator = true              # rerun checks in a clean clone before a pass counts
evaluator_runs = 1            # set to 2 if the checks are flaky; every run must pass

[commands]
shimmed = ["git", "curl", "wget", "ssh", "scp", "nc", "ftp", "telnet", "rsync", "pip", "npm", "sudo"]
forbidden = ["git push", "git remote", "git config", "git commit", "git reset", "git checkout", "sudo"]
allow_network = false

[paths]
forbidden = ["feature_list.json", "init.sh", ".gitignore", ".github/**"]

[worker]
command = ""                  # set here or pass --worker to `gatedcrew run`
check_timeout_seconds = 60
